name: MIDAS classic passive mark-only recovery

on:
  pull_request:
    paths:
      - 'classic_sp500/passive_recover_cli.py'
      - 'classic_sp500/tests/**'
      - '.github/workflows/classic_passive_recovery.yml'
      - 'strategy_comparison/inactive_recovery.py'
      - 'strategy_comparison/tests/test_inactive_recovery.py'
      - 'classic_sp500/corporate_actions.py'
  push:
    branches: [main]
    paths:
      - 'classic_sp500/passive_recover_cli.py'
      - '.github/workflows/classic_passive_recovery.yml'
  schedule:
    - cron: '21 6 * * 0,6'
  workflow_dispatch:
    inputs:
      recovery_kind:
        description: 'Passive marks or reviewed merger conversion with provisional receivables'
        type: choice
        options: [passive, merger, inactive]
        default: passive

permissions:
  contents: write

# Same lock as the ordinary classical trading run; never race economic writers.
concurrency:
  group: midas-classic-sp500
  cancel-in-progress: false

jobs:
  passive-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: timesfm_strategy/requirements-daily.txt
      - name: Install existing daily dependencies
        run: python -m pip install -r timesfm_strategy/requirements-daily.txt
      - name: Verify market data contract and all classic positions
        run: |
          python -m unittest discover -s classic_sp500/tests -v
          python -m unittest discover -s market_data/tests -v
          python -m unittest discover -s strategy_comparison/tests -v
      - name: Validate targeted MACD recovery on live frozen state WITHOUT writing
        if: ${{ github.event_name == 'pull_request' }}
        run: python strategy_comparison/inactive_recovery.py --engine classic --phase check --only-classic-book macd_12_26_9
      - name: Verify IL-011 CNP passive closing mark without writing or buying
        if: ${{ github.event_name == 'pull_request' }}
        run: python strategy_comparison/inactive_recovery.py --engine classic --phase check --only-classic-book ema_rsi_fixed
      - name: Validate IL-012 exact nine-session replay without writing or buying
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python strategy_comparison/inactive_recovery.py --engine classic --phase check \
            --only-classic-book genetic_frozen --reviewed-genetic-nine
      # First validate every historical quote and entitlement in a dry run.
      # This branch never changes cash, receivables, positions or trades and
      # never unlocks the separately guarded forward execution of unsettled KVUE/KMB.
      - name: Recover IL-013 plus nine IL-012 passive NAV sessions only
        if: github.event_name == 'push'
        run: |
          python strategy_comparison/inactive_recovery.py --engine classic --phase check --only-classic-book macd_12_26_9
          python strategy_comparison/inactive_recovery.py --engine classic --phase check --only-classic-book genetic_frozen --reviewed-genetic-nine
          python strategy_comparison/inactive_recovery.py --engine classic --phase recover --only-classic-book macd_12_26_9
          python strategy_comparison/inactive_recovery.py --engine classic --phase recover --only-classic-book genetic_frozen --reviewed-genetic-nine
      # 2026-11-19 reviewed, exact one-book recovery: IL-011 remained at
      # 17-Nov NAV because the 18-Nov CNP OHLC was invalid. The separately
      # SHA-verified 18-Nov CNP close is admissible for passive NAV ONLY.
      # The existing recovery guard keeps original trades, share counts,
      # cash, prior NAVs and unrelated classic books unchanged; it may not
      # synthesize an 18-Nov opening/stop or reopen 19-Nov retrospectively.
      - name: Recover IL-011 verified 18-Nov passive NAV without retroactive fills
        if: github.event_name == 'push'
        run: |
          python strategy_comparison/inactive_recovery.py --engine classic --phase check --only-classic-book ema_rsi_fixed
          python strategy_comparison/inactive_recovery.py --engine classic --phase recover --only-classic-book ema_rsi_fixed
      - name: Publish only the verified canonical books (no synthetic fills)
        if: github.event_name == 'push'
        run: |
          python strategy_comparison/publish_state.py \
            --message "Recover exactly reviewed classic passive NAV, no fills" \
            --path classic_sp500_state
      - name: Dry run recovery without touching paper state
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          RECOVERY_KIND: ${{ inputs.recovery_kind }}
        run: |
          if [ "$RECOVERY_KIND" = 'inactive' ]; then
            python strategy_comparison/inactive_recovery.py --engine classic --phase check
          elif [ "$RECOVERY_KIND" = 'merger' ]; then
            python classic_sp500/corporate_actions.py --phase check
          else
            python classic_sp500/passive_recover_cli.py --phase check
          fi
      - name: Recover only verified passive marks in the existing ledger
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          RECOVERY_KIND: ${{ inputs.recovery_kind }}
        run: |
          if [ "$RECOVERY_KIND" = 'inactive' ]; then
            python strategy_comparison/inactive_recovery.py --engine classic --phase recover
          elif [ "$RECOVERY_KIND" = 'merger' ]; then
            python classic_sp500/corporate_actions.py --phase recover
          else
            python classic_sp500/passive_recover_cli.py --phase recover
          fi
      - name: Publish only the canonical classical paper ledger
        if: ${{ success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          RECOVERY_KIND: ${{ inputs.recovery_kind }}
        run: |
          if [ "$RECOVERY_KIND" = 'merger' ]; then
            python classic_sp500/corporate_actions.py --phase publication-check
          fi
          python strategy_comparison/publish_state.py \
            --message "Record verified passive-only mark recovery" \
            --path classic_sp500_state
