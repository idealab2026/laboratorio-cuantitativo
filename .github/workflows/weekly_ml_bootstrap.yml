name: MIDAS weekly ML bootstrap replay

on:
  workflow_dispatch:
    inputs:
      replay_history:
        description: 'Recompute the separate historical diagnostic; never creates a prospective campaign'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: midas-weekly-ml-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: weekly_ml/requirements-live.txt
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1
          python -m pip install -r weekly_ml/requirements-live.txt
      - name: Verify bootstrap and weekly ML
        run: |
          python -m py_compile weekly_ml/*.py
          python -m unittest discover -s weekly_ml/tests -v
      - name: Replay Friday signal and Monday entry
        if: inputs.replay_history
        run: |
          python weekly_ml/bootstrap.py \
            --output weekly_ml_bootstrap_state \
            --signal-asof 2026-09-25 \
            --mark-asof 2026-09-28
      - name: Commit bootstrap smoke result
        if: inputs.replay_history
        run: |
          git add -- weekly_ml_bootstrap_state
          if ! git diff --cached --quiet; then
            git -c user.name='Idea Lab' -c user.email='350414243+idealab2026@users.noreply.github.com' commit -m 'Record non-prospective MIDAS weekly ML bootstrap'
            git push
          fi
