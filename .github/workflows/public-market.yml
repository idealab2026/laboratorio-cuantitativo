name: MIDAS institutional public-code Yahoo paper runtime
on:
  schedule:
    # Same market-data capture clock as the original common XNYS workflow.
    - cron: '07 23 * * 1-5'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Enable source-backed prospective two-reference paper run (requires rights gate and secret)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/public_market_runner.py'
      - 'scripts/test_public_market_runner.py'
      - '.github/workflows/public-market.yml'
      - 'data/public-paper-book.json'
permissions:
  contents: write
concurrency:
  group: midas-institutional-source-backed-public-code
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify new prospective engine without downloading market data
        run: |
          python3 -m unittest discover -s scripts -p 'test_public_market_runner.py' -v
          python3 scripts/public_market_runner.py --preflight
      - name: Disclose source permission gate
        run: |
          if [ "${{ vars.MIDAS_YAHOO_RIGHTS_CONFIRMED }}" != "true" ]; then
            echo "::notice::MIDAS stock-source run disabled: institutional Yahoo rights not confirmed."
          fi
          echo "No raw Yahoo quotes, personal accounts, or paper fills are generated during this preflight."

  execute:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.MIDAS_YAHOO_RIGHTS_CONFIRMED == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.execute))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MIDAS_YAHOO_RIGHTS_CONFIRMED: ${{ vars.MIDAS_YAHOO_RIGHTS_CONFIRMED }}
      IDEALAB_PAPER_FEED_KEY: ${{ secrets.IDEALAB_PAPER_FEED_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same Yahoo/yfinance and XNYS calendar dependency family
        run: python3 -m pip install -r scripts/requirements-yahoo.txt
      - name: Reconfirm bounded source, paper and signature invariants
        run: |
          python3 -m unittest discover -s scripts -p 'test_public_market_runner.py' -v
          python3 scripts/public_market_runner.py --preflight
      - name: Advance only prospective, rights-attested XNYS reference sessions
        run: python3 scripts/public_market_runner.py --execute
      - name: Validate signed, nonraw public results
        run: |
          python3 scripts/paper_feed.py --validate data/institutional-paper-feed.json
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from public_market_runner import validate_state
          with open("data/public-paper-book.json", encoding="utf8") as stream:
              validate_state(json.load(stream), os.environ["IDEALAB_PAPER_FEED_KEY"])
          print("HMAC and cash/book accounting accepted")
          PY
      - name: Commit only the independent public paper bookkeeping and safe summary
        run: |
          set -euo pipefail
          if git diff --quiet -- data/public-paper-book.json data/institutional-paper-feed.json; then
            echo "No newly completed market session, no commit"
            exit 0
          fi
          bad="$(git status --porcelain | grep -Ev 'data/(public-paper-book|institutional-paper-feed).json$' || true)"
          test -z "$bad"
          git config user.name "Idea Lab"
          git config user.email "350414243+idealab2026@users.noreply.github.com"
          git add -- data/public-paper-book.json data/institutional-paper-feed.json
          git commit -m "Record independent prospective MIDAS paper reference books"
          git push origin HEAD:main
