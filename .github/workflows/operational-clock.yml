name: MIDAS shared market execution clock

on:
  pull_request:
    paths:
      - 'scripts/operational_clock.py'
      - 'scripts/test_operational_clock.py'
      - 'scripts/native_forward_settlement.py'
      - 'scripts/test_native_forward_settlement.py'
      - 'capital_cycle/engine.py'
      - 'buy_the_dip_strategy/engine.py'
      - '.github/workflows/operational-clock.yml'
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options:
          - prepare
          - observe
        required: true
  schedule:
    # 09:20 ET: lock tomorrow's actual source-ledger orders before the market opens.
    - cron: '20 9 * * 1-5'
      timezone: 'America/New_York'
    # Exchange-local 09:30 opening observations are best effort, never made up.
    - cron: '31,36,41,46,51,56 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '1,16,31,46 10-15 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: midas-shared-operational-clock
  cancel-in-progress: false

jobs:
  market-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: buy_the_dip_strategy/requirements-live.txt
      - name: Install calendar and free minute quote adapter
        run: python -m pip install --disable-pip-version-check -r buy_the_dip_strategy/requirements-live.txt
      - name: Verify no-lookahead and shared engine clock
        run: |
          python -m py_compile scripts/operational_clock.py scripts/forward_open_il039.py scripts/native_forward_settlement.py
          python -m unittest scripts.test_operational_clock -v
          python -m unittest scripts.test_forward_open_il039 -v
          python -m unittest scripts.test_native_forward_settlement -v
      - name: Prepare frozen signal plan or check market observations
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            STAGE="$(jq -r '.inputs.stage // empty' "$GITHUB_EVENT_PATH")"
          else
            CRON="$(jq -r '.schedule // empty' "$GITHUB_EVENT_PATH")"
            if [ "$CRON" = '20 9 * * 1-5' ]; then STAGE=prepare; else STAGE=observe; fi
          fi
          PYTHONPATH=scripts:. python scripts/operational_clock.py --stage "$STAGE"
      - name: Publish operator observations and canonical native paper fills
        # The same transaction owns journal and BOTH official campaign ledgers.
        # Keep the historical night valuation jobs; they see pending=None after
        # a forward fill and therefore cannot buy a second time.
        if: github.event_name != 'pull_request'
        run: |
          python strategy_comparison/publish_state.py \
            --message "Record MIDAS timely native fills and operator observations" \
            --path data/operational-clock.json \
            --path forward_open_state/global-lock.json \
            --path capital_cycle_state/ledger.json \
            --path buy_the_dip_state/ledger.json
      - name: Verify native fills survived publication
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          PYTHONPATH=scripts:. python scripts/native_forward_settlement.py --verify-published
      - name: Old publishing step (disabled after native settlement)
        if: false
        if: github.event_name != 'pull_request'
        run: |
          python strategy_comparison/publish_state.py \
            --message "Update MIDAS shared operational clock observations" \
            --path data/operational-clock.json \
            --path forward_open_state/global-lock.json
