name: MIDAS shared market execution clock

on:
  # Emergency bootstrap: a reviewed change to this operator workflow on main
  # triggers an immediate, clock-guarded run without waiting for GitHub cron.
  # Safe outside preopen: the Python operator refuses any retroactive lock.
  push:
    branches: [main]
    paths:
      - '.github/workflows/operational-clock.yml'
  pull_request:
    paths:
      - 'scripts/operational_clock.py'
      - 'scripts/test_operational_clock.py'
      - 'scripts/native_forward_settlement.py'
      - 'scripts/test_native_forward_settlement.py'
      - 'scripts/forward_weekly_ml_settlement.py'
      - 'scripts/test_forward_weekly_ml_settlement.py'
      - 'scripts/forward_ahp_settlement.py'
      - 'scripts/test_forward_ahp_settlement.py'
      - 'scripts/forward_timesfm_settlement.py'
      - 'scripts/test_forward_timesfm_settlement.py'
      - 'scripts/forward_genetic_settlement.py'
      - 'scripts/test_forward_genetic_settlement.py'
      - 'AGENTE/genetic_invest_agent/forward_portfolio.py'
      - 'timesfm_strategy/forward_execution.py'
      - 'timesfm_strategy/run.py'
      - 'timesfm_strategy/daily_run.py'
      - 'scripts/build_opening_plan.py'
      - 'tfg_ahp/forward.py'
      - 'tfg_ahp/paper.py'
      - 'scripts/classic_forward_settlement.py'
      - 'scripts/test_classic_forward_settlement.py'
      - 'classic_sp500/run.py'
      - 'weekly_ml/daily.py'
      - 'capital_cycle/engine.py'
      - 'buy_the_dip_strategy/engine.py'
      - '.github/workflows/operational-clock.yml'
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options:
          - prepare
          - observe
        required: true
  schedule:
    # Redundant actual-time preparations starting >2h before 09:30 ET.
    # Scheduled jobs may be delayed or dropped; only the FIRST valid lock wins.
    - cron: '17,47 7-8 * * 1-5'
      timezone: 'America/New_York'
    - cron: '7,17 9 * * 1-5'
      timezone: 'America/New_York'
    # Exchange-local opening quotes are best effort, never backfilled.
    - cron: '31,36,41,46,51,56 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '1,16,31,46 10-15 * * 1-5'
      timezone: 'America/New_York'
    # Both regular 16:00 and 13:00 half-session preclose exits.
    - cron: '56,58,59 12,15 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  # Never let a test PR queue ahead of the live pre-opening writer.
  group: midas-clock-${{ github.event_name == 'pull_request' && format('ci-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  market-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: buy_the_dip_strategy/requirements-live.txt
      - name: Install calendar and free minute quote adapter
        run: python -m pip install --disable-pip-version-check -r buy_the_dip_strategy/requirements-live.txt
      - name: Verify no-lookahead and shared engine clock
        run: |
          python -m py_compile scripts/operational_clock.py scripts/forward_open_il039.py scripts/native_forward_settlement.py scripts/forward_weekly_ml_settlement.py scripts/classic_forward_settlement.py scripts/forward_ahp_settlement.py scripts/forward_timesfm_settlement.py timesfm_strategy/forward_execution.py timesfm_strategy/run.py timesfm_strategy/daily_run.py scripts/forward_genetic_settlement.py AGENTE/genetic_invest_agent/forward_portfolio.py weekly_ml/daily.py classic_sp500/run.py tfg_ahp/forward.py
          python -m unittest scripts.test_operational_clock -v
          python -m unittest scripts.test_forward_open_il039 -v
          python -m unittest scripts.test_native_forward_settlement -v
          python -m unittest scripts.test_forward_weekly_ml_settlement -v
          python -m unittest scripts.test_classic_forward_settlement -v
          python -m unittest scripts.test_forward_ahp_settlement -v
          python -m unittest scripts.test_forward_timesfm_settlement -v
          python -m unittest scripts.test_forward_genetic_settlement -v
      - name: Prepare frozen signal plan or check market observations
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            STAGE="$(jq -r '.inputs.stage // empty' "$GITHUB_EVENT_PATH")"
          else
            # The actual NYSE clock, not the nominal cron string, decides.
            # A delayed prepare cannot create a false post-opening FX snapshot.
            STAGE=auto
          fi
          PYTHONPATH=scripts:. python scripts/operational_clock.py --stage "$STAGE"
      - name: Publish operator observations and canonical native paper fills
        # The same transaction owns journal and BOTH official campaign ledgers.
        # Keep the historical night valuation jobs; they see pending=None after
        # a forward fill and therefore cannot buy a second time.
        if: github.event_name != 'pull_request'
        run: |
          python strategy_comparison/publish_state.py \
            --message "Record MIDAS timely native fills and operator observations" \
            --path data/operational-clock.json \
            --path forward_open_state/global-lock.json \
            --path capital_cycle_state/ledger.json \
            --path buy_the_dip_state/ledger.json \
            --path weekly_ml_daily_state/ledger.json \
            --path classic_sp500_state/ledger.json \
            --path tfg_state/ledger.json \
            --path timesfm_state/ledger.json \
            --path timesfm_daily_state/ledger.json \
            --path AGENTE/genetic_invest_agent/registro_historico/diario_portfolio_forward_2026-10-12.json
      - name: Verify native fills survived publication
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          PYTHONPATH=scripts:. python -c 'from operational_clock import verify_published_lock; print(verify_published_lock())'
          PYTHONPATH=scripts:. python scripts/native_forward_settlement.py --verify-published
          PYTHONPATH=scripts:. python -c 'from forward_weekly_ml_settlement import verify_published; print({"verified_weekly_ml_slots": verify_published()})'
          PYTHONPATH=scripts:. python -c 'from classic_forward_settlement import verify_published; print({"verified_classic_slots": verify_published()})'
          PYTHONPATH=scripts:. python -c 'from forward_ahp_settlement import verify_published; print({"verified_ahp_slots": verify_published()})'
          PYTHONPATH=scripts:. python -c 'from forward_timesfm_settlement import verify_published; print({"verified_timesfm_eur_slots": verify_published()})'
          PYTHONPATH=scripts:. python -c 'from forward_genetic_settlement import verify_published; print({"verified_genetic_slots": verify_published()})'
