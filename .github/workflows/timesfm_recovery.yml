name: MIDAS TimesFM causal inactive NAV recovery

on:
  pull_request:
    paths:
      - 'timesfm_strategy/inactive_recovery.py'
      - 'timesfm_strategy/tests/test_inactive_recovery.py'
      - '.github/workflows/timesfm_recovery.yml'
  # One reviewed push triggers bounded recovery once; subsequent ledger
  # publication does not match this path and cannot create a feedback loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/timesfm_recovery.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write only verified historic NAV marks, without fills'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: midas-timesfm-eur
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      XDG_CACHE_HOME: \${{ runner.temp }}/midas-timesfm-recovery-\${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: timesfm_strategy/requirements-daily.txt
      - name: Install lightweight market snapshot and FX runtime
        run: python -m pip install -r timesfm_strategy/requirements-daily.txt
      - name: Verify temporal causality and held-only NAV reconciliation
        run: |
          python -m unittest discover -s timesfm_strategy/tests -p test_inactive_recovery.py -v
          python timesfm_strategy/run.py --phase check
          python timesfm_strategy/daily_run.py --phase check
      - name: Inspect the actual frozen ledgers and recover only inactive marks
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.apply)
        run: python timesfm_strategy/inactive_recovery.py --phase recover
      - name: Manual read-only review
        if: github.event_name == 'workflow_dispatch' && !inputs.apply
        run: python timesfm_strategy/inactive_recovery.py --phase check
      - name: Publish validated original EUR campaign ledgers
        if: >-
          success() && (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.apply))
        run: |
          python strategy_comparison/publish_state.py \
            --message "TimesFM verifiable inactive NAV marks, no retro fills" \
            --path timesfm_state \
            --path timesfm_daily_state
