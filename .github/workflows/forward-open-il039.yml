name: MIDAS IL039 forward opening observer

on:
  pull_request:
    paths:
      - 'scripts/forward_open_il039.py'
      - 'scripts/test_forward_open_il039.py'
      - '.github/workflows/forward-open-il039.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Prepare before US market opens, observe after open'
        required: true
        type: choice
        options:
          - prepare
          - observe
  schedule:
    # Clock follows New York, including DST. Actions starts are best effort.
    - cron: '20 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '31,36,41,46 9 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: midas-forward-il039
  cancel-in-progress: false

jobs:
  forward-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: buy_the_dip_strategy/requirements-live.txt
      - name: Install free open-session observation dependencies
        run: python -m pip install --disable-pip-version-check -r buy_the_dip_strategy/requirements-live.txt
      - name: Verify forward chronology, no-lookahead and idempotency
        run: |
          python -m py_compile scripts/forward_open_il039.py
          python -m unittest scripts.test_forward_open_il039 -v
      - name: Observe eligible US session, but never invent auction fills
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            STAGE="$(jq -r '.inputs.stage // empty' "$GITHUB_EVENT_PATH")"
          else
            CRON="$(jq -r '.schedule // empty' "$GITHUB_EVENT_PATH")"
            if [ "$CRON" = '20 9 * * 1-5' ]; then STAGE=prepare; else STAGE=observe; fi
          fi
          PYTHONPATH=. python scripts/forward_open_il039.py --stage "$STAGE"
      - name: Publish only independently labeled forward trial observations
        if: github.event_name != 'pull_request'
        run: |
          python strategy_comparison/publish_state.py \
            --message "Record IL-039 forward opening observation (not broker execution)" \
            --path data/forward-open-il039.json \
            --path forward_open_state/il039-lock.json
